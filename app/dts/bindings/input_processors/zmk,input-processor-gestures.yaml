description: Input processor for turning relative XY movement into directional behavior taps

compatible: "zmk,input-processor-gestures"

include: ip_zero_param.yaml

properties:
  type:
    type: int
  x-code:
    type: int
  y-code:
    type: int
  threshold:
    type: int
  timeout-ms:
    type: int
  cooldown-ms:
    type: int
  tap-ms:
    type: int
  layer-id:
    type: int
    required: true
  positions:
    type: array
    required: true
